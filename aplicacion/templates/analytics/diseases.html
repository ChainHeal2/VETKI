{% extends 'base.html' %}
{% block title %}VETKI | Dashboard epidemiológico{% endblock %}
{% block main %}
<h1 class="h2 mb-4">Dashboard epidemiológico Chile</h1>
<div id="diseaseCards" class="row g-3 mb-4"></div>
<div class="card bg-body-tertiary border-0 p-3" style="min-height: 360px;">
    <canvas id="diseaseChart" aria-label="Variación de casos clínicos" role="img"></canvas>
    <p id="diseaseStatus" class="small text-body-secondary mt-3 mb-0" role="status">
        Cargando indicadores...
    </p>
</div>
{% endblock %}
{% block footer %}
{{ super() }}
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"
    onerror="document.getElementById('diseaseStatus').textContent='No se pudo cargar la librería de gráficos.'"></script>
<script>
document.addEventListener("DOMContentLoaded", async () => {
    const status = document.getElementById("diseaseStatus");
    try {
        const response = await fetch("{{ url_for('api.disease_analytics') }}", {
            headers: { "Accept": "application/json" }
        });
        const payload = await response.json();
        if (!response.ok || !Array.isArray(payload.diseases)) {
            throw new Error(payload.error || "No se pudieron cargar los indicadores.");
        }
        const diseases = payload.diseases;
        document.getElementById("diseaseCards").innerHTML = diseases.map(d => `
            <div class="col-12 col-sm-6 col-lg-3"><div class="card h-100 border-0 bg-body-tertiary p-3">
                <span class="small text-body-secondary">${d.disease}</span>
                <strong class="fs-3">${d.variation_percent > 0 ? "↑" : d.variation_percent < 0 ? "↓" : "→"} ${Math.abs(d.variation_percent)}%</strong>
                <span class="small text-body-secondary">${d.current_cases} casos últimos 30 días</span>
            </div></div>`).join("");
        if (!window.Chart) {
            throw new Error("La librería de gráficos no está disponible.");
        }
        new Chart(document.getElementById("diseaseChart"), {
            type: "bar",
            data: {
                labels: diseases.map(d => d.disease),
                datasets: [{
                    label: "% variación",
                    data: diseases.map(d => d.variation_percent),
                    backgroundColor: ["#0d6efd", "#198754", "#ffc107", "#dc3545"]
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                scales: { y: { beginAtZero: true } }
            }
        });
        status.textContent = diseases.every(d => d.current_cases === 0 && d.previous_cases === 0)
            ? "No hay casos registrados todavía; se muestran los indicadores en cero."
            : "Comparación de casos entre los últimos 30 días y el período anterior.";
    } catch (error) {
        status.textContent = error.message || "No se pudieron cargar los indicadores.";
    }
});
</script>
{% endblock %}
